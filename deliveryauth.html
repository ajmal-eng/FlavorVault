<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlavorVault Delivery Login</title>
  <link rel="manifest" href="manifest-delivery.json">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/delivery/favicon-32x32.png">
  <link rel="apple-touch-icon" href="icons/delivery/apple-touch-icon.png">
  <meta name="theme-color" content="#e8572a">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" defer></script>
  <script>
    const apiParam = new URLSearchParams(window.location.search).get("api");
    // Frontend (this page) and backend now live on different domains
    // (frontend on InfinityFree, backend on Render), so always point at
    // the real backend URL rather than assuming same-origin.
    const defaultApiBase = "https://flavorvault-iy25.onrender.com";
    const configuredApiBase = (apiParam || window.__FLAVORVAULT_API_URL__ || defaultApiBase).replace(/\/$/, "");
    window.FLAVORVAULT_API_BASE = configuredApiBase;
    const originalFetch = window.fetch.bind(window);
    window.fetch = function(resource, options) {
      if (typeof resource === "string" && resource.startsWith("http://localhost:5000")) {
        resource = `${window.FLAVORVAULT_API_BASE}${resource.slice("http://localhost:5000".length)}`;
      }
      const token = localStorage.getItem("deliveryAuthToken");
      if (token && typeof resource === "string" && resource.startsWith(window.FLAVORVAULT_API_BASE)) {
        options = options || {};
        options.headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
      }
      return originalFetch(resource, options);
    };
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>
  <link rel="icon" sizes="32x32" href="Capture-removebg-preview.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
:root {
  --bg: #faf6f1; --bg-deep: #f0e8dd; --fg: #1a1209; --fg-muted: #7a6e5d;
  --accent: #e8572a; --accent-hover: #d04420; --accent-light: rgba(232,87,42,0.1);
  --green: #2d8a4e; --green-light: rgba(45,138,78,0.1);
  --card: #ffffff; --border: #e8dfd3; --shadow: 0 4px 24px rgba(26,18,9,0.06);
  --shadow-lg: 0 12px 48px rgba(26,18,9,0.1); --radius: 14px; --radius-sm: 8px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--fg); line-height: 1.6; overflow-x: hidden; }
.panel-card { background: var(--card); border-radius: 24px; padding: 32px; border: 1px solid var(--border); box-shadow: var(--shadow); margin-bottom: 32px; }
.panel-card h3 { margin-bottom: 20px; font-family: 'Playfair Display', serif; }
.panel-card .form-group { margin-bottom: 18px; }
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(250,246,241,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); transition: var(--transition); }
.nav-inner { max-width: 1320px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--fg); text-decoration: none; display: flex; align-items: center; gap: 10px; }
.nav-logo .logo-icon { width: 38px; height: 38px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1rem; }
.nav-actions { display: flex; gap: 8px; align-items: center; }
.btn { padding: 10px 22px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: var(--transition); border: none; display: inline-flex; align-items: center; gap: 8px; font-family: 'DM Sans', sans-serif; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--fg); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { padding: 7px 14px; font-size: 0.8rem; }
.section { padding: 60px 24px; position: relative; z-index: 1; }
.section-inner { max-width: 1320px; margin: 0 auto; }
.section-header { margin-bottom: 40px; }
.section-header h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
.section-header p { color: var(--fg-muted); font-size: 1rem; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--fg-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--fg); transition: var(--transition); }
.form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.form-error { font-size: 0.78rem; color: #dc2626; margin-top: 4px; }
.modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.toast-container { position: fixed; top: 80px; right: 24px; z-index: 5000; display: flex; flex-direction: column; gap: 10px; }
.toast { padding: 14px 20px; border-radius: var(--radius-sm); background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px; font-size: 0.88rem; font-weight: 500; animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards; min-width: 260px; }
.toast-success { border-left: 4px solid var(--green); }
.toast-success i { color: var(--green); }
.toast-error { border-left: 4px solid #dc2626; }
.toast-error i { color: #dc2626; }
.toast-info { border-left: 4px solid var(--accent); }
.toast-info i { color: var(--accent); }
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastOut { to { transform: translateX(100%); opacity: 0; } }
.modal-overlay { position: fixed; inset: 0; background: rgba(26,18,9,0.5); backdrop-filter: blur(6px); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: var(--transition); }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--card); border-radius: 20px; padding: 36px; width: 440px; max-width: 92vw; max-height: 90vh; overflow-y: auto; transform: scale(0.9) translateY(20px); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); box-shadow: var(--shadow-lg); }
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; }
.admin-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; }
.admin-card h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
.order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; }
.order-id-col { text-align: center; }
.order-id { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 900; color: var(--accent); }
.order-date { font-size: 0.75rem; color: var(--fg-muted); }
.order-total-col { text-align: right; }
.order-total { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; }
.delivery-route-card { margin-top: 16px; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, rgba(232,87,42,0.08), rgba(45,138,78,0.08)); border: 1px solid rgba(45,138,78,0.18); }
.route-label { font-weight: 700; margin-bottom: 12px; color: var(--fg); }
.route-track { position: relative; height: 72px; padding: 12px; background: rgba(255,255,255,0.95); border-radius: 18px; border: 1px solid rgba(26,18,9,0.08); display: grid; grid-template-columns: minmax(90px,1fr) 48px minmax(90px,1fr); align-items: center; gap: 12px; }
.route-track.delivered .route-progress { background: rgba(45,138,78,0.45); }
.route-progress { position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%); height: 6px; background: rgba(26,18,9,0.12); border-radius: 999px; }
.route-truck { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 44px; height: 34px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; animation: truckRide 3s ease-in-out infinite; }
.route-truck.delivered { left: calc(100% - 54px); animation: none; background: var(--green); }
.route-stop { position: relative; display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--fg-muted); }
.route-stop span { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }
.route-stop.end span { background: var(--green); }
.route-status { margin-top: 12px; font-size: 0.9rem; color: var(--fg); }
@keyframes truckRide { 0%,100% { left: 10px; } 50% { left: calc(100% - 54px); } }
#map { height: 400px; width: 100%; border-radius: 12px; border: 1px solid var(--border); z-index: 1; }
.location-status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; background: var(--accent-light); color: var(--accent); margin-bottom: 12px; }
.location-status.active { background: var(--green-light); color: var(--green); }
.location-status .pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulseDot 1.5s ease-in-out infinite; }
@keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.4); } }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--fg-muted); cursor: pointer; transition: var(--transition); margin-bottom: 20px; border: none; background: none; font-family: 'DM Sans', sans-serif; }
.back-link:hover { color: var(--accent); }
@media (max-width: 900px) { .order-card { grid-template-columns: 1fr; text-align: center; } .order-id-col, .order-total-col { text-align: center; } }
@media (max-width: 600px) { #map { height: 300px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="indexuser.html" class="nav-logo">
        <div class="logo-icon"><i class="fas fa-utensils"></i></div>
        FlavorVault Delivery
      </a>
      <div class="nav-actions">
        <div id="deliveryMenuWrap" style="position:relative;display:inline-block;">
          <button class="btn btn-outline btn-sm" id="deliveryMenuBtn" onclick="event.stopPropagation(); toggleDeliveryMenu();"><i class="fas fa-bars"></i> Menu</button>
          <div id="deliveryMenuDropdown" style="display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);min-width:190px;overflow:hidden;z-index:200;">
            <div id="deliveryMenuName" style="padding:14px 16px;font-weight:600;border-bottom:1px solid var(--border);display:none;"></div>
            <button onclick="window.location.href='indexuser.html'" style="width:100%;text-align:left;padding:12px 16px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:0.9rem;color:var(--fg);"><i class="fas fa-utensils" style="width:18px;"></i> User Site</button>
            <button onclick="window.location.href='admin.html'" style="width:100%;text-align:left;padding:12px 16px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:0.9rem;color:var(--fg);"><i class="fas fa-shield-halved" style="width:18px;"></i> Admin Panel</button>
            <button id="installAppBtn" style="display:none;width:100%;text-align:left;padding:12px 16px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:0.9rem;color:var(--fg);" onclick="installPwa()"><i class="fas fa-download" style="width:18px;"></i> Install App</button>
            <button id="deliveryMenuSignOut" style="display:none;width:100%;text-align:left;padding:12px 16px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:0.9rem;color:var(--accent);border-top:1px solid var(--border);" onclick="logout()"><i class="fas fa-right-from-bracket" style="width:18px;"></i> Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </nav>
  <main class="section" style="margin-top: 90px;">
    <div class="section-inner" id="deliveryApp"></div>
  </main>
  <div class="toast-container" id="toastContainer"></div>
  <div class="modal-overlay" id="orderDetailModal" onclick="if(event.target===this) closeOrderDetails()">
    <div class="modal" style="max-width:520px; position:relative;">
      <button class="back-link" style="position:absolute;top:16px;right:16px;" onclick="closeOrderDetails();event.stopPropagation();"><i class="fas fa-times"></i></button>
      <div id="orderDetailContent" style="margin-top:36px"></div>
    </div>
  </div>
  <script>
    const ADMIN_CONTACT_EMAIL = 'admin@flavorvault.com';
    // Only the logged-in delivery boy's session lives in localStorage.
    function getCurrentDelivery(){ try{ return JSON.parse(localStorage.getItem('deliveryBoy')); }catch{ return null; } }
    function setCurrentDelivery(user){ localStorage.setItem('deliveryBoy', JSON.stringify(user)); renderApp(); }

    function toggleDeliveryMenu(){
      const dropdown = document.getElementById('deliveryMenuDropdown');
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }
    function closeDeliveryMenu(){
      const dropdown = document.getElementById('deliveryMenuDropdown');
      if (dropdown) dropdown.style.display = 'none';
    }
    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('deliveryMenuWrap');
      if (wrap && !wrap.contains(e.target)) closeDeliveryMenu();
    });
    function updateDeliveryMenu(current){
      const nameEl = document.getElementById('deliveryMenuName');
      const signOutBtn = document.getElementById('deliveryMenuSignOut');
      const menuBtn = document.getElementById('deliveryMenuBtn');
      if (!nameEl || !signOutBtn || !menuBtn) return;
      if (current) {
        nameEl.textContent = current.name;
        nameEl.style.display = 'block';
        signOutBtn.style.display = 'block';
        menuBtn.innerHTML = `<i class="fas fa-user-check"></i> ${current.name.split(' ')[0]}`;
      } else {
        nameEl.style.display = 'none';
        signOutBtn.style.display = 'none';
        menuBtn.innerHTML = `<i class="fas fa-bars"></i> Menu`;
      }
    }

    function logout(){
      if(window.deliveryWatchId !== undefined && navigator.geolocation){
        navigator.geolocation.clearWatch(window.deliveryWatchId);
        window.deliveryWatchId = undefined;
      }
      localStorage.removeItem('deliveryBoy');
      localStorage.removeItem('deliveryAuthToken');
      if(window.deliveryMap){ window.deliveryMap.remove(); window.deliveryMap = null; window.deliveryMarker = null; }
      closeDeliveryMenu();
      renderApp();
      showToast('Signed out','info');
    }
    async function loginDelivery(){
      const email=document.getElementById('deliveryEmail').value.trim();
      const password=document.getElementById('deliveryPass').value.trim();
      const err=document.getElementById('deliveryError');
      err.style.display='none';
      if(!email || !password){ err.textContent='Enter both email and password'; err.style.display='block'; return; }

      try {
        const response = await fetch('http://localhost:5000/api/deliveryboys/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if(!response.ok || !data.deliveryBoy){
          err.textContent = data.message || 'Invalid delivery credentials';
          err.style.display='block';
          return;
        }
        localStorage.setItem('deliveryAuthToken', data.token);
        setCurrentDelivery(data.deliveryBoy);
        showToast(`Welcome, ${data.deliveryBoy.name}`,'success');
      } catch(error) {
        console.error('DELIVERY LOGIN ERROR:', error);
        err.textContent = 'Cannot connect to backend';
        err.style.display='block';
      }
    }

    async function loadAssignedOrders(){
      const currentBoy = getCurrentDelivery();
      if(!currentBoy) return [];
      try {
        const response = await fetch("http://localhost:5000/api/orders");
        const data = await response.json();
        if(!data.success) return [];
        const assignedOrders = data.orders.filter(order => String(order.deliveryBoyId) === String(currentBoy._id) && order.prepared === true && order.status !== 'delivered').map(order => ({
          ...order,
          id: order._id,
          total: order.totalAmount,
          items: (order.items || []).map(item => ({ ...item, qty: item.quantity }))
        }));
        window.assignedOrders = assignedOrders;
        return assignedOrders;
      } catch (error) { console.error(error); return []; }
    }

    // Generates a UPI QR code for the exact order amount, using the
    // logged-in delivery boy's own UPI ID. Free QR image API, no signup
    // needed. Customer scans with any UPI app (GPay/PhonePe/Paytm etc.)
    function showPaymentQr(orderId, amount){
      const currentBoy = getCurrentDelivery();
      if (!currentBoy || !currentBoy.upiId) {
        showToast('No UPI ID set for your account - ask admin to add one', 'error');
        return;
      }
      const upiUri = `upi://pay?pa=${encodeURIComponent(currentBoy.upiId)}&pn=FlavorVault&am=${amount.toFixed(2)}&cu=INR&tn=${encodeURIComponent('Order ' + String(orderId).slice(-4))}`;
      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(upiUri)}`;

      let modal = document.getElementById('paymentQrModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'paymentQrModal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        document.body.appendChild(modal);
      }
      modal.innerHTML = `
        <div style="background:#fff;border-radius:16px;padding:28px;max-width:340px;width:100%;text-align:center;">
          <h3 style="margin-bottom:6px;">Scan to Pay</h3>
          <p style="color:var(--fg-muted);margin-bottom:16px;">₹${amount.toFixed(2)}</p>
          <img src="${qrImageUrl}" alt="Payment QR" style="width:100%;max-width:260px;border-radius:12px;border:1px solid var(--border);">
          <button class="btn btn-outline btn-sm" style="margin-top:16px;width:100%;" onclick="document.getElementById('paymentQrModal').remove()">Close</button>
        </div>
      `;
    }

    async function markAsPaid(orderId){
      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/orders/${orderId}/mark-paid`, {
          method: 'PUT'
        });
        const data = await response.json();
        if (!data.success) {
          showToast(data.message || 'Could not update payment status', 'error');
          return;
        }
        const qrModal = document.getElementById('paymentQrModal');
        if (qrModal) qrModal.remove();
        showToast('Marked as paid', 'success');
        await renderApp();
      } catch (err) {
        console.error('MARK AS PAID ERROR:', err);
        showToast('Cannot connect to backend', 'error');
      }
    }

    async function setOrderStatus(orderId, status){
      try {
        const response = await fetch(`http://localhost:5000/api/orders/${orderId}/status`, {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });
        const data = await response.json();
        if(data.success){
          showToast('Order status updated','success');
          await renderApp();
          // Show the customer's location on the in-page map the moment
          // delivery starts - stays on this screen, no new tab opened.
          if (status === 'out for delivery') {
            const order = (window.assignedOrders || []).find(o => o.id === orderId);
            const address = order && order.address;
            if (address) {
              showCustomerOnMap(address);
            }
          }
          // Show the invoice automatically the moment delivery is confirmed.
          if (status === 'delivered') {
            window.open(`${window.FLAVORVAULT_API_BASE}/api/orders/${orderId}/invoice`, '_blank');
          }
        }
        else { showToast(data.message || 'Status update failed','error'); }
      } catch (error) { console.error(error); showToast('Cannot update status','error'); }
    }

    function filterDeliveryOrders(value){
      window.deliverySearchValue = value;
      const filtered = (window.currentAssignedOrders || []).filter(o =>
        (o.customerName || '').toLowerCase().includes(value.toLowerCase())
      );
      document.getElementById('deliveryOrdersContainer').innerHTML = renderOrders(filtered);
    }

    function renderOrders(orders){
      if(!orders.length) return '<p style="color:var(--fg-muted)">No orders assigned yet.</p>';
      return orders.map(o => {
        const deliveredClass = o.status === 'delivered' ? ' delivered' : '';
        const routeLabel = o.status === 'delivered' ? 'Delivery complete' : 'Live delivery route';
        const routeStatus = o.status === 'delivered' ? 'Delivered successfully' : `Status: ${o.status.charAt(0).toUpperCase() + o.status.slice(1)}`;
        return `<div class="order-card fade-in" style="margin-bottom:12px;">
          <div class="order-id-col">
            <div class="order-id" onclick="openOrderDetails('${o.id}')" style="cursor:pointer;">#${String(o.id).padStart(4,'0')}</div>
            <div class="order-date">${new Date(o.createdAt).toLocaleString()}</div>
          </div>
          <div style="font-size:0.9rem;color:var(--fg);line-height:1.6;">
            ${(o.items || []).map(i => `${i.qty}x ${i.name}`).join(' · ')}
            <div style="margin-top:6px;color:var(--fg-muted);font-size:0.85rem;">
              <i class="fas fa-location-dot"></i> ${o.address || 'Address not available'}
            </div>
            <div class="delivery-route-card">
              <div class="route-label">${routeLabel}</div>
              <div class="route-track${deliveredClass}">
                <div class="route-progress"></div>
                <div class="route-truck${deliveredClass}"><i class="fas fa-truck"></i></div>
                <div class="route-stop start"><span></span>Kitchen</div>
                <div class="route-stop end"><span></span>Customer</div>
              </div>
              <div class="route-status">${routeStatus}</div>
            </div>
          </div>
          <div class="order-total-col">
            <div class="order-total">${(o.total || 0).toFixed(2)}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
              <button class="btn btn-outline btn-sm" onclick="setOrderStatus('${o.id}','preparing')">Preparing</button>
              <button class="btn btn-outline btn-sm" onclick="setOrderStatus('${o.id}','out for delivery')">Out for Delivery</button>
              <button class="btn btn-outline btn-sm" onclick="setOrderStatus('${o.id}','delivered')">Delivered</button>
              <button class="btn btn-outline btn-sm" onclick="showCustomerOnMap('${(o.address || '').replace(/'/g, "\\'")}')"><i class="fas fa-map-location-dot"></i> Locate Customer</button>
              <a class="btn btn-sm" href="tel:${o.phone || ''}" style="background:var(--green);color:#fff;display:inline-flex;align-items:center;gap:6px;text-decoration:none;"><i class="fas fa-phone"></i> Call Customer</a>
              ${o.paymentStatus === 'Paid'
                ? `<span class="btn btn-sm" style="background:var(--green-light);color:var(--green);pointer-events:none;"><i class="fas fa-circle-check"></i> Paid</span>`
                : `<button class="btn btn-outline btn-sm" onclick="showPaymentQr('${o.id}', ${o.total || 0})"><i class="fas fa-qrcode"></i> Show Payment QR</button>
                   <button class="btn btn-sm" style="background:var(--green);color:#fff;" onclick="markAsPaid('${o.id}')"><i class="fas fa-check"></i> Mark as Paid</button>`
              }
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function initDeliveryMap(lat, lng){
      if(window.deliveryMap){
        window.deliveryMap.setView([lat, lng], 15);
        if(window.deliveryMarker){ window.deliveryMarker.setLatLng([lat, lng]); }
        else {
          window.deliveryMarker = L.marker([lat, lng]).addTo(window.deliveryMap).bindPopup('You are here');
        }
        return;
      }
      window.deliveryMap = L.map('map').setView([lat, lng], 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(window.deliveryMap);
      window.deliveryMarker = L.marker([lat, lng]).addTo(window.deliveryMap).bindPopup('You are here').openPopup();
    }

    function getCustomerIcon() {
      return L.divIcon({
        className: 'customer-map-pin',
        html: '<div style="background:#e8572a;width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 20]
      });
    }

    // Looks up the customer's typed address on the map (free OpenStreetMap
    // geocoding, no API key needed) and shows it as a pin alongside the
    // delivery boy's own live position, zooming to fit both.
    async function showCustomerOnMap(address){
      if(!address){ showToast('No address available for this order', 'error'); return; }
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`);
        const data = await res.json();
        if(!data.length){
          showToast('Could not find that address on the map', 'error');
          return;
        }
        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);

        // Create the map ourselves, centered on the customer, if the
        // delivery boy's own GPS map hasn't been created yet (e.g. location
        // permission not granted/loaded yet). The customer pin should never
        // depend on that.
        if (!window.deliveryMap) {
          window.deliveryMap = L.map('map').setView([lat, lng], 15);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(window.deliveryMap);
        }

        if(window.customerMarker){
          window.customerMarker.setLatLng([lat, lng]);
        } else {
          window.customerMarker = L.marker([lat, lng], { icon: getCustomerIcon() }).addTo(window.deliveryMap).bindPopup('Customer location');
        }
        window.customerMarker.openPopup();

        if (window.deliveryMarker) {
          const bounds = L.latLngBounds([window.deliveryMarker.getLatLng(), [lat, lng]]);
          window.deliveryMap.fitBounds(bounds, { padding: [50, 50] });
        } else {
          window.deliveryMap.setView([lat, lng], 15);
        }

        document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (err) {
        console.error('GEOCODE ERROR:', err);
        showToast('Could not locate that address', 'error');
      }
    }

    function updateLocationStatus(state, message){
      const el = document.getElementById('locationStatus');
      if(!el) return;
      el.className = 'location-status' + (state === 'active' ? ' active' : '');
      el.innerHTML = `<span class="pulse"></span> ${message}`;
    }

    function startLocationTracking(){
      if(!navigator.geolocation){ showToast('Geolocation not supported by this browser', 'error'); return; }
      updateLocationStatus('', 'Requesting location access...');
      navigator.geolocation.watchPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          initDeliveryMap(lat, lng);
          updateLocationStatus('active', `Live · ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
          const currentBoy = getCurrentDelivery();
          if(!currentBoy) return;
          try {
            await fetch(`http://localhost:5000/api/deliveryboys/${currentBoy._id}/location`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ lat, lng })
            });
          } catch (error) { console.error('UPDATE LOCATION ERROR:', error); }
        },
        (error) => {
          console.error('Geolocation error:', error);
          updateLocationStatus('', 'Location access denied or unavailable');
          showToast('Location access denied. Enable location to share live position.', 'error');
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    }

    async function renderApp(){
      const app=document.getElementById('deliveryApp');
      const current=getCurrentDelivery();
      updateDeliveryMenu(current);
      if(!current){
        app.innerHTML=`
          <div class="panel-card" style="max-width:520px;margin:40px auto;">
            <h3>Delivery Boy Sign In</h3>
            <div class="form-group"><label>Email</label><input class="form-input" id="deliveryEmail" type="email" placeholder="sam.delivery@flavorvault.com"></div>
            <div class="form-group"><label>Password</label><input class="form-input" id="deliveryPass" type="password" placeholder="Password"></div>
            <div id="deliveryError" class="form-error" style="display:none"></div>
            <div class="modal-actions"><button class="btn btn-primary" onclick="loginDelivery()"><i class="fas fa-sign-in-alt"></i> Sign In</button></div>
            <p style="margin-top:16px;color:var(--fg-muted);font-size:0.9rem">Delivery boys can sign in using their assigned credentials. Contact admin at ${ADMIN_CONTACT_EMAIL} if you need access.</p>
          </div>`;
        return;
      }

      const assigned = await loadAssignedOrders();
      app.innerHTML=`
        <div class="section-header" style="margin-bottom:24px;"><h2>Delivery Dashboard</h2><p>Your active assignments and admin contact</p></div>
        <div class="admin-card fade-in" style="margin-bottom:24px;">
          <h3>Welcome, ${current.name}</h3>
          <p><strong>Email:</strong> ${current.email}</p>
          <p><strong>Phone:</strong> ${current.phone||'Not provided'}</p>
          <p><strong>Admin contact:</strong> ${ADMIN_CONTACT_EMAIL}</p>
        </div>
        <div class="admin-card fade-in" style="margin-bottom:24px;">
          <h3>My Live Location</h3>
          <div id="locationStatus" class="location-status"><span class="pulse"></span> Initializing map...</div>
          <div id="map"></div>
          <p style="margin-top:10px;color:var(--fg-muted);font-size:0.88rem"><i class="fas fa-info-circle"></i> Your location is automatically shared with the customer so they can track your delivery in real time.</p>
        </div>
        <div class="admin-card fade-in">
          <h3>Assigned Orders (${assigned.length})</h3>
          <input type="text" id="deliverySearchOrder" placeholder="Search by customer name..." value="${window.deliverySearchValue || ''}" oninput="filterDeliveryOrders(this.value)" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:16px;font-family:inherit;">
          <div id="deliveryOrdersContainer">${renderOrders(assigned.filter(o => (o.customerName || '').toLowerCase().includes((window.deliverySearchValue || '').toLowerCase())))}</div>
        </div>
      `;
      window.currentAssignedOrders = assigned;
      setTimeout(() => startLocationTracking(), 300);
    }

    function showToast(msg, type='info'){
      // Pop-up notifications disabled per request. Errors/success are still
      // logged to the console for debugging, they just don't show on screen.
      console.log(`[${type}]`, msg);
    }

    function getOrderById(orderId){
      return (window.assignedOrders||[]).find(o=>o.id===orderId);
    }

    function openOrderDetails(orderId){
      const order=getOrderById(orderId);
      if(!order) return;
      const customerName=order.customerName||'Unknown';
      const customerPhone=order.phone||'Not provided';
      const customerAddress=order.address||'Address not available';
      const directionsUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(customerAddress);
      document.getElementById('orderDetailContent').innerHTML=`
        <button class="back-link" onclick="closeOrderDetails()"><i class="fas fa-arrow-left"></i> Close</button>
        <h3>Order Details</h3>
        <div class="panel-card" style="padding:20px;margin-bottom:20px;">
          <p><strong>Order #</strong> #${String(order.id).padStart(4,'0')}</p>
          <p><strong>Status:</strong> ${order.status.charAt(0).toUpperCase()+order.status.slice(1)}</p>
          <p><strong>Placed by:</strong> ${customerName}</p>
          <p><strong>Phone:</strong> ${customerPhone}</p>
          <p><strong>Delivery location:</strong> ${customerAddress}</p>
          <a class="btn btn-primary btn-sm" href="${directionsUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;">
            <i class="fas fa-location-arrow"></i> Get Directions
          </a>
        </div>
        <div class="panel-card" style="padding:20px;">
          <h4>Items</h4>
          ${order.items.map(item=>`<div style="margin-bottom:12px"><strong>${item.qty}\u00d7 ${item.name}</strong><br><span style="color:var(--fg-muted)">${item.price.toFixed(2)} each</span></div>`).join('')}
          <div style="margin-top:16px;font-weight:700;color:var(--accent)">Total: ${order.total.toFixed(2)}</div>
        </div>
      `;
      document.getElementById('orderDetailModal').classList.add('open');
    }

    function closeOrderDetails(){
      document.getElementById('orderDetailModal').classList.remove('open');
    }

    let socket;
    window.addEventListener('load', () => {
      socket = io(window.FLAVORVAULT_API_BASE);
      socket.on("delivery-assigned", data => {
        const currentBoy = getCurrentDelivery();
        if (!currentBoy || data.deliveryBoyId !== currentBoy._id) return;
        showToast("New Delivery Assigned", "success");
        renderApp();
      });
      socket.on("order-prepared", () => {
        renderApp();
      });
    });

    window.addEventListener('storage',(event)=>{ if(event.key==='deliveryBoy') renderApp(); });
    window.addEventListener('load', async ()=>{ await renderApp(); });

    // ---- Install as an app (PWA) ----
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'inline-flex';
    });
    async function installPwa() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById('installAppBtn').style.display = 'none';
    }
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'none';
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
