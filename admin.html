<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlavorVault Admin</title>
  <link rel="manifest" href="manifest-admin.json">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#e8572a">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const apiParam = new URLSearchParams(window.location.search).get("api");
    // Frontend (this page) and backend now live on different domains
    // (frontend on InfinityFree, backend on Render), so always point at
    // the real backend URL rather than assuming same-origin.
    const defaultApiBase = "https://flavorvault-iy25.onrender.com";
    const configuredApiBase = (apiParam || window.__FLAVORVAULT_API_URL__ || defaultApiBase).replace(/\/$/, "");
    window.FLAVORVAULT_API_BASE = configuredApiBase;
    const originalFetch = window.fetch.bind(window);
    window.fetch = function(resource, options) {
      if (typeof resource === "string") {
        if (resource.startsWith("http://localhost:5000")) {
          resource = `${window.FLAVORVAULT_API_BASE}${resource.slice("http://localhost:5000".length)}`;
        } else if (resource.startsWith("https://localhost:5000")) {
          resource = `${window.FLAVORVAULT_API_BASE}${resource.slice("https://localhost:5000".length)}`;
        }
      }
      // Automatically attach the logged-in admin's token to every request
      // going to our own backend, so protected routes work without having
      // to touch every individual fetch call.
      const token = localStorage.getItem("authToken");
      if (token && typeof resource === "string" && resource.startsWith(window.FLAVORVAULT_API_BASE)) {
        options = options || {};
        options.headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
      }
      return originalFetch(resource, options);
    };
  </script>
  <style>
:root {
  --bg: #faf6f1;
  --bg-deep: #f0e8dd;
  --fg: #1a1209;
  --fg-muted: #7a6e5d;
  --accent: #e8572a;
  --accent-hover: #d04420;
  --accent-light: rgba(232,87,42,0.1);
  --green: #2d8a4e;
  --green-light: rgba(45,138,78,0.1);
  --card: #ffffff;
  --border: #e8dfd3;
  --shadow: 0 4px 24px rgba(26,18,9,0.06);
  --shadow-lg: 0 12px 48px rgba(26,18,9,0.1);
  --radius: 14px;
  --radius-sm: 8px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg); color: var(--fg);
  line-height: 1.6; overflow-x: hidden;
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
body::before {
  content: ''; position: fixed; top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(232,87,42,0.06) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: ''; position: fixed; bottom: -300px; left: -200px;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(45,138,78,0.05) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(250,246,241,0.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); transition: var(--transition);
}
.navbar.scrolled { box-shadow: var(--shadow); }
.nav-inner {
  max-width: 1320px; margin: 0 auto; padding: 0 24px;
  height: 68px; display: flex; align-items: center; justify-content: space-between;
}
.nav-logo {
  font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900;
  color: var(--fg); text-decoration: none;
  display: flex; align-items: center; gap: 10px;
}
.nav-logo .logo-icon {
  width: 38px; height: 38px; background: var(--accent); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1rem;
}
.nav-links { display: flex; gap: 6px; align-items: center; }
.nav-link {
  padding: 8px 16px; border-radius: var(--radius-sm); text-decoration: none;
  color: var(--fg-muted); font-weight: 500; font-size: 0.9rem;
  transition: var(--transition); cursor: pointer; border: none; background: none;
}
.nav-link:hover, .nav-link.active { color: var(--accent); background: var(--accent-light); }
.nav-actions { display: flex; gap: 8px; align-items: center; }
.cart-btn {
  position: relative; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--card); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg); font-size: 1.1rem; transition: var(--transition);
}
.cart-btn:hover { border-color: var(--accent); color: var(--accent); }
.cart-badge {
  position: absolute; top: -4px; right: -4px;
  background: var(--accent); color: #fff; font-size: 0.65rem; font-weight: 700;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--bg);
}
.btn {
  padding: 10px 22px; border-radius: var(--radius-sm); font-weight: 600;
  font-size: 0.88rem; cursor: pointer; transition: var(--transition);
  border: none; display: inline-flex; align-items: center; gap: 8px;
  font-family: 'DM Sans', sans-serif;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,87,42,0.3); }
.btn-outline { background: transparent; color: var(--fg); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #237041; transform: translateY(-1px); }
.btn-sm { padding: 7px 14px; font-size: 0.8rem; }
.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.hero { margin-top: 68px; padding: 80px 24px 60px; position: relative; overflow: hidden; }
.hero-inner {
  max-width: 1320px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
}
.hero-text h1 {
  font-family: 'Playfair Display', serif; font-size: 3.8rem;
  font-weight: 900; line-height: 1.1; margin-bottom: 20px;
}
.hero-text h1 span { color: var(--accent); }
.hero-text p { color: var(--fg-muted); font-size: 1.15rem; max-width: 480px; margin-bottom: 32px; }
.hero-stats { display: flex; gap: 40px; margin-top: 40px; }
.hero-stat-num { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--accent); }
.hero-stat-label { font-size: 0.82rem; color: var(--fg-muted); margin-top: 2px; }
.hero-img { position: relative; height: 480px; border-radius: 24px; overflow: hidden; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 6s ease; }
.hero-img:hover img { transform: scale(1.05); }
.hero-float-card {
  position: absolute; bottom: 20px; left: 20px;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
  border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 12px;
}
.hero-float-icon {
  width: 46px; height: 46px; border-radius: 12px;
  background: var(--green-light); color: var(--green);
  display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
}
.hero-float-text strong { display: block; font-size: 0.9rem; }
.hero-float-text span { font-size: 0.78rem; color: var(--fg-muted); }
.section { padding: 60px 24px; position: relative; z-index: 1; }
.section-inner { max-width: 1320px; margin: 0 auto; }
.section-header { margin-bottom: 40px; }
.section-header h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 900; margin-bottom: 8px; }
.section-header p { color: var(--fg-muted); font-size: 1rem; }
.cat-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
.cat-pill {
  padding: 8px 20px; border-radius: 50px; border: 1.5px solid var(--border);
  background: var(--card); font-size: 0.85rem; font-weight: 500;
  cursor: pointer; transition: var(--transition); color: var(--fg-muted);
}
.cat-pill:hover, .cat-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.search-bar { display: flex; gap: 12px; margin-bottom: 32px; max-width: 500px; }
.search-input {
  flex: 1; padding: 12px 18px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 0.9rem; font-family: 'DM Sans', sans-serif; background: var(--card); color: var(--fg);
  transition: var(--transition);
}
.search-input:focus { outline: none; border-color: var(--accent); }
.food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
.food-card {
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
  overflow: hidden; transition: var(--transition); cursor: pointer;
}
.food-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.food-card-img { width: 100%; height: 200px; object-fit: cover; transition: transform 0.5s ease; }
.food-card:hover .food-card-img { transform: scale(1.06); }
.food-card-img-wrap { overflow: hidden; position: relative; }
.food-card-badge {
  position: absolute; top: 12px; left: 12px; padding: 4px 12px; border-radius: 50px;
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-popular { background: var(--accent); color: #fff; }
.badge-new { background: var(--green); color: #fff; }
.badge-spicy { background: #f59e0b; color: #fff; }
.food-card-body { padding: 18px; }
.food-card-cat { font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.food-card-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; margin: 6px 0; }
.food-card-desc { font-size: 0.83rem; color: var(--fg-muted); margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.food-card-footer { display: flex; align-items: center; justify-content: space-between; }
.food-card-price { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--accent); }
.food-card-rating { display: flex; align-items: center; gap: 4px; font-size: 0.82rem; color: var(--fg-muted); }
.food-card-rating i { color: #f59e0b; font-size: 0.75rem; }
.food-card-actions { display: flex; gap: 8px; margin-top: 14px; }
.cart-overlay {
  position: fixed; inset: 0; background: rgba(26,18,9,0.4); backdrop-filter: blur(4px);
  z-index: 2000; opacity: 0; pointer-events: none; transition: var(--transition);
}
.cart-overlay.open { opacity: 1; pointer-events: all; }
.cart-sidebar {
  position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 90vw;
  background: var(--bg); z-index: 2001; transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column;
}
.cart-sidebar.open { transform: translateX(0); }
.cart-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.cart-header h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; }
.cart-close {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--card); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 1rem; color: var(--fg-muted); transition: var(--transition);
}
.cart-close:hover { color: var(--accent); border-color: var(--accent); }
.cart-body { flex: 1; overflow-y: auto; padding: 16px 24px; }
.cart-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: center; }
.cart-item-img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; }
.cart-item-info { flex: 1; }
.cart-item-name { font-weight: 600; font-size: 0.92rem; }
.cart-item-price { color: var(--accent); font-weight: 700; font-size: 0.9rem; }
.cart-item-qty { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 0.8rem; color: var(--fg); transition: var(--transition);
}
.qty-btn:hover { border-color: var(--accent); color: var(--accent); }
.cart-item-remove { color: var(--fg-muted); cursor: pointer; font-size: 0.85rem; transition: var(--transition); }
.cart-item-remove:hover { color: #dc2626; }
.cart-empty { text-align: center; padding: 60px 20px; color: var(--fg-muted); }
.cart-empty i { font-size: 3rem; margin-bottom: 16px; display: block; opacity: 0.3; }
.cart-footer { padding: 24px; border-top: 1px solid var(--border); }
.cart-total { display: flex; justify-content: space-between; margin-bottom: 16px; }
.cart-total-label { font-weight: 600; }
.cart-total-price { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--accent); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(26,18,9,0.5); backdrop-filter: blur(6px);
  z-index: 3000; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: var(--transition);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--card); border-radius: 20px; padding: 36px; width: 440px;
  max-width: 92vw; max-height: 90vh; overflow-y: auto;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); box-shadow: var(--shadow-lg);
}
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--fg-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input {
  width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 0.92rem; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--fg);
  transition: var(--transition); letter-spacing: 0.5px;
}
.form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.form-input::placeholder { color: #c4b8a6; letter-spacing: 0; }
textarea.form-input { resize: vertical; min-height: 80px; }
select.form-input { cursor: pointer; }
.form-error { font-size: 0.78rem; color: #dc2626; margin-top: 4px; }
.modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.code-boxes { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
.code-box {
  width: 48px; height: 56px; text-align: center; font-size: 1.4rem; font-weight: 700;
  border: 2px solid var(--border); border-radius: 10px; background: var(--bg);
  font-family: 'DM Sans', sans-serif; color: var(--fg); transition: var(--transition);
}
.code-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.email-sent-visual {
  text-align: center; padding: 10px 0 20px;
}
.email-sent-icon {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 16px;
  background: var(--green-light); display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--green); animation: pulse 2s ease infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.resend-timer { font-size: 0.82rem; color: var(--fg-muted); text-align: center; margin-top: 12px; }
.resend-timer a { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; }
.resend-timer a.disabled { color: var(--fg-muted); pointer-events: none; }
.toast-container { position: fixed; top: 80px; right: 24px; z-index: 5000; display: flex; flex-direction: column; gap: 10px; }
.toast {
  padding: 14px 20px; border-radius: var(--radius-sm); background: var(--card);
  border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 10px; font-size: 0.88rem; font-weight: 500;
  animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards; min-width: 260px;
}
.toast-success { border-left: 4px solid var(--green); }
.toast-success i { color: var(--green); }
.toast-error { border-left: 4px solid #dc2626; }
.toast-error i { color: #dc2626; }
.toast-info { border-left: 4px solid var(--accent); }
.toast-info i { color: var(--accent); }
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastOut { to { transform: translateX(100%); opacity: 0; } }
.denied-icon {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px;
  background: #fee2e2; display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: #dc2626;
}
.denied-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: #dc2626; margin-bottom: 8px; }
.denied-text { text-align: center; color: var(--fg-muted); font-size: 0.92rem; line-height: 1.6; }
.denied-actions { justify-content: center; margin-top: 24px; }
.admin-grid { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
.admin-sidebar { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 0; height: fit-content; position: sticky; top: 92px; }
.admin-nav-item {
  padding: 12px 20px; font-size: 0.88rem; font-weight: 500; color: var(--fg-muted);
  cursor: pointer; transition: var(--transition); display: flex; align-items: center;
  gap: 10px; border: none; background: none; width: 100%; text-align: left;
  font-family: 'DM Sans', sans-serif;
}
.admin-nav-item:hover, .admin-nav-item.active { color: var(--accent); background: var(--accent-light); }
.admin-nav-item i { width: 20px; text-align: center; }
.admin-content { min-height: 400px; }
.admin-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
.admin-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.admin-stat { padding: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); }
.admin-stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; margin-bottom: 12px; }
.admin-stat-value { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; }
.admin-stat-label { font-size: 0.8rem; color: var(--fg-muted); margin-top: 2px; }
.admin-table { width: 100%; border-collapse: collapse; }
.admin-table th { text-align: left; padding: 12px 14px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--fg-muted); border-bottom: 2px solid var(--border); font-weight: 600; }
.admin-table td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 0.88rem; vertical-align: middle; }
.admin-table tr:hover td { background: var(--accent-light); }
.admin-table-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
.admin-split-grid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }

/* Mobile responsiveness for the admin panel */
@media (max-width: 820px) {
  .navbar { position: static; }
  .nav-inner { flex-wrap: wrap; gap: 10px; padding: 12px 16px; height: auto; }
  .nav-logo { font-size: 1.2rem; gap: 6px; }
  .nav-logo .logo-icon { width: 32px; height: 32px; font-size: 0.85rem; }
  .nav-actions { flex-wrap: wrap; width: 100%; justify-content: flex-start; }
  .nav-actions .btn { flex: 1 1 auto; text-align: center; font-size: 0.78rem; padding: 8px 10px; }
  main.section { margin-top: 16px !important; }

  .admin-card { padding: 16px; }
  .admin-split-grid { grid-template-columns: 1fr !important; }

  .admin-table { display: block; width: 100%; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  .admin-table thead, .admin-table tbody, .admin-table tr { display: table; width: 100%; table-layout: fixed; }

  .filters { flex-direction: column; align-items: stretch; }
  .filters input, .filters select, .filters button { width: 100%; }

  .admin-stat-grid, .dashboard-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .admin-stat, .dashboard-card { padding: 14px; }
  .admin-stat-value, .dashboard-card h1 { font-size: 1.4rem !important; }

  .food-upload-btn { width: 100%; justify-content: center; }
}
@media (max-width: 480px) {
  .section-inner { padding: 0 12px; }
  h1, h2 { font-size: 1.4rem !important; }
  .btn { font-size: 0.8rem; padding: 8px 12px; }
}

  <div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">

  <!-- Edit Section Div -->
  <div id="editSection" style="display:none;position:fixed;top:68px;left:0;right:0;bottom:0;background:var(--bg);z-index:999;overflow-y:auto;padding:40px 24px"></div>

  <script>
    const ADMIN_CONTACT_EMAIL = 'admin@flavorvault.com';

    // Small localStorage helper (used for admin-only UI state like the
    // currently-open delivery profile / last assignment banner). This is
    // separate from MongoDB - it only stores lightweight UI state in the browser.
    const DB={
      get(k){ try{return JSON.parse(localStorage.getItem('fv_'+k));}catch{return null;} },
      set(k,v){ localStorage.setItem('fv_'+k,JSON.stringify(v)); }
    };

    // In-memory app state, always populated from the backend. Never treat
    // these as a source of truth on their own - loadFoods()/loadOrders()/
    // loadDeliveryBoys()/loadCoupons() are what keep them current.
    let foods = [];
    let orders = [];
    let coupons = [];
    let deliveryBoys = [];

    // Only the signed-in admin's session lives in localStorage.
    function getCurrentUser(){ try{ return JSON.parse(localStorage.getItem('adminUser')); }catch{ return null; } }
    function setCurrentUser(user){ localStorage.setItem('adminUser', JSON.stringify(user)); renderApp(); }
    function logout(){ localStorage.removeItem('adminUser'); localStorage.removeItem('authToken'); renderApp(); showToast('Signed out','info'); }
    function isAdmin(){ const u=getCurrentUser(); return u && u.role==='admin'; }

    async function loginAdmin(){
      const email=document.getElementById('adminEmail').value.trim();
      const password=document.getElementById('adminPass').value.trim();
      const err=document.getElementById('adminError');
      err.style.display='none';
      if(!email || !password){ err.textContent='Enter both email and password'; err.style.display='block'; return; }

      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/users/login`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if(!response.ok || !data.user || data.user.role !== 'admin'){
          err.textContent = data.message || 'Invalid admin credentials';
          err.style.display='block';
          return;
        }
        setCurrentUser(data.user);
        localStorage.setItem('authToken', data.token);
        showToast('Welcome, Admin','success');
        await renderApp();
      } catch(error){
        console.error('ADMIN LOGIN ERROR:', error);
        err.textContent = 'Cannot connect to backend';
        err.style.display = 'block';
      }
    }

    function getDeliveryBoys(){ return deliveryBoys; }
    function getOrders(){ return orders; }
    function getOrderById(id){ return getOrders().find(o=>String(o._id||o.id)===String(id)); }

    function getFoods(){ return foods; }

    async function loadCoupons() {
      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/coupons`);
        const data = await response.json();

        coupons = data.coupons || [];
        renderCouponTable();
      } catch (error) {
        console.error("LOAD COUPONS ERROR:", error);
      }
    }

    function renderCouponTable() {
      const table = document.getElementById("couponTable");
      if (!table) return;

      table.innerHTML = coupons.length
        ? coupons.map(coupon => `
          <tr>
            <td>${coupon.code}</td>
            <td>${coupon.discount}%</td>
            <td>${coupon.active ? "Active" : "Inactive"}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="editCoupon('${coupon._id}')"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger btn-sm" onclick="deleteCoupon('${coupon._id}')"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `).join("")
        : `<tr><td colspan="4" style="text-align:center;color:var(--fg-muted)">No coupons yet.</td></tr>`;
    }

    async function addCoupon() {
      const code = document.getElementById("couponCodeInput").value.trim();
      const discount = Number(document.getElementById("couponDiscountInput").value);
      const active = document.getElementById("couponActiveInput").checked;

      if (!code || !discount) {
        showToast("Coupon code and discount are required", "error");
        return;
      }

      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/coupons/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, discount, active })
        });

        const data = await response.json();

        if (!response.ok) {
          showToast(data.message || "Coupon add failed", "error");
          return;
        }

        document.getElementById("couponForm").reset();
        document.getElementById("couponActiveInput").checked = true;
        showToast("Coupon added", "success");
        loadCoupons();
      } catch (error) {
        console.error(error);
        showToast("Cannot add coupon", "error");
      }
    }

    async function editCoupon(id) {
      const coupon = coupons.find(item => item._id === id);
      if (!coupon) return;

      const code = prompt("Coupon code", coupon.code);
      if (code === null) return;

      const discountValue = prompt("Discount percentage", coupon.discount);
      if (discountValue === null) return;

      const discount = Number(discountValue);
      if (!code.trim() || !discount) {
        showToast("Coupon code and discount are required", "error");
        return;
      }

      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/coupons/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code: code.trim(),
            discount,
            active: coupon.active
          })
        });

        const data = await response.json();

        if (!response.ok) {
          showToast(data.message || "Coupon update failed", "error");
          return;
        }

        showToast("Coupon updated", "success");
        loadCoupons();
      } catch (error) {
        console.error(error);
        showToast("Cannot update coupon", "error");
      }
    }

    async function deleteCoupon(id) {
      if (!(await showConfirm("Delete this coupon?"))) return;

      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/coupons/${id}`, {
          method: "DELETE"
        });

        const data = await response.json();

        if (!response.ok) {
          showToast(data.message || "Coupon delete failed", "error");
          return;
        }

        showToast("Coupon deleted", "success");
        loadCoupons();
      } catch (error) {
        console.error(error);
        showToast("Cannot delete coupon", "error");
      }
    }

    let editingFoodId = null;
    
    function editFood(id){
      const key = String(id);
      const food = getFoods().find(f => String(f.id) === key || String(f._id) === key);

      if(!food) return;

      editingFoodId = key;

      const editSection = document.getElementById('editSection');
      editSection.innerHTML = `
        <div style="max-width:760px;margin:0 auto;background:var(--card);border-radius:var(--radius);padding:32px;border:1px solid var(--border);box-shadow:var(--shadow);">
          <button class="back-link" onclick="closeEditSection()" style="margin-bottom:20px"><i class="fas fa-arrow-left"></i> Back</button>
          <h2 style="font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;margin-bottom:24px;"><i class="fas fa-pen"></i> Edit Food Item</h2>
          <div class="form-group"><label>Name</label><input id="editName" class="form-input" type="text" value="${food.name}" style="font-size:1rem;padding:14px"></div>
          <div class="form-group"><label>Category</label><input id="editCategory" class="form-input" type="text" value="${food.category}" style="font-size:1rem;padding:14px"></div>
          <div class="form-group"><label>Price</label><input id="editPrice" class="form-input" type="number" step="0.01" value="${food.price}" style="font-size:1rem;padding:14px"></div>
          <div class="form-group"><label>Description</label><textarea id="editDescription" class="form-input" style="font-size:1rem;padding:14px;min-height:120px">${food.desc || ''}</textarea></div>
          <div class="form-group" style="display:flex;align-items:center;gap:10px;">
            <input type="checkbox" id="editTrending" ${food.trending ? 'checked' : ''} style="width:18px;height:18px;">
            <label for="editTrending" style="margin:0;cursor:pointer;">Show as "Trending Now" on homepage (only one item can be trending at a time)</label>
          </div>
          <div class="form-group" style="display:flex;align-items:center;gap:10px;background:${food.available ? 'transparent' : 'rgba(232,87,42,0.08)'};padding:${food.available ? '0' : '12px'};border-radius:10px;">
            <input type="checkbox" id="editAvailable" ${food.available ? 'checked' : ''} style="width:18px;height:18px;">
            <label for="editAvailable" style="margin:0;cursor:pointer;">
              ${food.available ? 'In stock (uncheck to mark unavailable / out of stock)' : '<strong style="color:var(--accent);">Currently unavailable</strong> - check to restock and make available again'}
            </label>
          </div>
          <div class="form-group">
            <label>Image</label>
            <input id="editImage" class="form-input" type="text" value="${food.img || ''}" placeholder="Paste image URL, or upload from your device below" style="font-size:1rem;padding:14px">
            <div style="display:flex;align-items:center;gap:12px;margin-top:10px;">
              <label for="editImageFile" class="food-upload-btn">
                <i class="fas fa-camera"></i> Choose Photo
              </label>
              <input type="file" id="editImageFile" accept="image/*" style="display:none;">
              <span id="editImageFileName" style="font-size:0.85rem;color:var(--fg-muted);">No file chosen</span>
            </div>
          </div>
          <div style="margin-bottom:20px;"><img id="editImagePreview" src="${food.img || ''}" alt="Preview" style="width:100%;max-width:320px;border-radius:16px;border:1px solid var(--border);object-fit:cover"></div>
          <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="saveFoodEdit()"><i class="fas fa-save"></i> Save Changes</button>
            <button class="btn btn-outline" onclick="closeEditSection()"><i class="fas fa-times"></i> Cancel</button>
          </div>
        </div>
      `;

      document.getElementById("editName").value = food.name;
      document.getElementById("editCategory").value = food.category;
      document.getElementById("editPrice").value = food.price;
      document.getElementById("editDescription").value = food.desc || "";
      document.getElementById("editImage").value = food.img || "";
      document.getElementById("editImagePreview").src = food.img || "";

      document.getElementById("editImage").addEventListener("input", e => {
        document.getElementById("editImagePreview").src = e.target.value;
      });

      const editImageFile = document.getElementById("editImageFile");
      editImageFile.addEventListener("change", async () => {
        const file = editImageFile.files[0];
        if (!file) return;
        document.getElementById("editImageFileName").textContent = file.name;
        try {
          const formData = new FormData();
          formData.append("image", file);
          const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/foods/upload-image`, {
            method: "POST",
            body: formData
          });
          const data = await response.json();
          if (data.success) {
            const fullUrl = data.url.startsWith("http") ? data.url : `${window.FLAVORVAULT_API_BASE}${data.url}`;
            document.getElementById("editImage").value = fullUrl;
            document.getElementById("editImagePreview").src = fullUrl;
            showToast("Image uploaded", "success");
          } else {
            showToast(data.message || "Upload failed", "error");
          }
        } catch (err) {
          console.error("IMAGE UPLOAD ERROR:", err);
          showToast("Image upload failed", "error");
        }
      });

      editSection.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    async function saveFoodEdit(){
      if(!editingFoodId) return;
      const name = document.getElementById('editName').value.trim();
      const category = document.getElementById('editCategory').value.trim();
      const price = Number(document.getElementById('editPrice').value);
      const description = document.getElementById('editDescription').value.trim();
      const image = document.getElementById('editImage').value.trim();

      if(!name || !category || !price){
        showToast('Name, category and price are required', 'error');
        return;
      }

      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/foods/${editingFoodId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('editName').value,
            category: document.getElementById('editCategory').value,
            price: Number(document.getElementById('editPrice').value),
            description: document.getElementById('editDescription').value,
            image: document.getElementById('editImage').value,
            trending: document.getElementById('editTrending').checked,
            available: document.getElementById('editAvailable').checked
          })
        });
        const data = await response.json();
        if(!response.ok){
          showToast(data.message || 'Update failed', 'error');
          return;
        }
        showToast('Food updated successfully', 'success');
        closeEditSection();
        await loadFoods();
      } catch(err){
        console.error(err);
        showToast('Cannot connect to backend', 'error');
      }
    }

    function closeEditSection(){
      document.getElementById('editSection').style.display = 'none';
      editingFoodId = null;
      document.getElementById('editSection').innerHTML = '';
    }

    function closeDeliveryProfile(){
      DB.set('deliveryProfileId', null);
      renderApp();
    }

    async function loadFoods() {
      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/foods`);
        const data = await response.json();

        if (!data.success) return;

        foods = data.foods.map(food => ({
          _id: food._id,
          id: String(food._id),
          name: food.name,
          category: food.category,
          price: food.price,
          desc: food.description || '',
          img: food.image || '',
          badge: food.badge || '',
          trending: !!food.trending,
          available: food.available !== false,
          rating: 4.5,
          reviews: 0
        }));
      } catch (error) {
        console.error('LOAD FOODS ERROR:', error);

    async function loadOrders() {
      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/orders`);
        const data = await response.json();

        if (!data.success) return;

        orders = data.orders;
        // Delivered orders move to the History modal only - keep the main
        // Orders list focused on orders still in progress.
        renderOrders(orders.filter(o => o.status !== "delivered"));
        const historyBtn = document.getElementById("historyBtn");
        if (historyBtn) {
          const deliveredCount = orders.filter(o => o.status === "delivered").length;
          historyBtn.innerHTML = `<i class="fas fa-clock-rotate-left"></i> History (${deliveredCount} Delivered)`;
        }
      } catch (error) {
        console.error(error);
      }
    }

    function filterOrders() {
      const search = document.getElementById("searchOrder").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;

      // Delivered orders live in the History modal only, never in the main list.
      let filtered = getOrders().filter(order => order.status !== "delivered");

      if (search) {
        filtered = filtered.filter(order =>
          (order.customerName || '').toLowerCase().includes(search)
        );
      }

      if (status !== "All") {
        filtered = filtered.filter(order => order.status === status);
      }

      renderOrders(filtered);
    }

    // Switches to a dedicated History page showing delivered orders,
    // most-recently-delivered first - a full page like "My Orders" on the
    // user site, not a popup over the dashboard.
    function showRecentlyDelivered() {
      let filtered = getOrders().filter(order => order.status === "delivered");
      filtered.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
      renderOrders(filtered, "historyOrdersContainer");
      document.getElementById("adminApp").closest("main").style.display = "none";
      document.getElementById("historySection").style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeHistoryModal() {
      document.getElementById("historySection").style.display = "none";
      document.getElementById("adminApp").closest("main").style.display = "";
    }

    async function changeStatus(orderId, status) {

      try {

        const response = await fetch(
          `${window.FLAVORVAULT_API_BASE}/api/orders/${orderId}/status`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ status })
          }
        );

        const data = await response.json();

        if(data.success){
          showToast("Order status updated", "success");
          await loadOrders();
          if (status === "delivered") {
            showRecentlyDelivered();
          }
        }

      } catch(error){
        console.error(error);
      }
    }

    async function assignDeliveryBoy(orderId) {
      try {
        const select = document.getElementById(`delivery-${orderId}`);
        if (!select) return;

        const deliveryBoyId = select.value;
        if (!deliveryBoyId) {
          showToast("Select a Delivery Boy", "error");
          return;
        }

        const deliveryBoyName = select.options[select.selectedIndex].text;

        const response = await fetch(
          `${window.FLAVORVAULT_API_BASE}/api/orders/${orderId}/assign`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              deliveryBoyId,
              deliveryBoyName
            })
          }
        );

        const data = await response.json();

        if (data.success) {
          showToast("Assigned Successfully", "success");
          await loadOrders();
        } else {
          showToast(data.message || 'Assignment failed','error');
        }
      } catch (error) {
        console.error(error);
        showToast('Cannot assign delivery boy','error');
      }
    }

          `${window.FLAVORVAULT_API_BASE}/api/foods/${id}`,
          {
            method: "PUT",

      const name = document.getElementById('editDbName').value.trim();

        const ordersRes = await fetch(`${window.FLAVORVAULT_API_BASE}/api/orders`);

    async function loadSalesChart() {
      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/orders`);
        const data = await response.json();
        const orders = data.orders || [];
        const revenueMap = {};

        orders.forEach(order => {
          const isPaidOrDelivered =
            String(order.status).toLowerCase() === "delivered" ||
            String(order.paymentStatus).toLowerCase() === "paid";
          if(!isPaidOrDelivered) return;
          const day = new Date(order.createdAt).toLocaleDateString();
          revenueMap[day] = (revenueMap[day] || 0) + order.totalAmount;
        });

        const labels = Object.keys(revenueMap);
        const values = Object.values(revenueMap);

        new Chart(document.getElementById("salesChart"), {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "Daily Revenue ($)",
              data: values,
              borderColor: "var(--accent)",
              backgroundColor: "rgba(232, 87, 42, 0.1)",
              tension: 0.4,
              fill: true
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: { legend: { display: true } },
            scales: { y: { beginAtZero: true } }
          }
        });
      } catch(error) {
        console.error("Sales Chart Error:", error);
      }
    }

    async function loadTopFoods() {
      try {
        const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/orders`);
        const data = await response.json();
        const sales = {};

        data.orders.forEach(order => {
          order.items.forEach(item => {
            sales[item.name] = (sales[item.name] || 0) + item.quantity;
          });
        });

        const foods = Object.entries(sales)
          .sort((a,b) => b[1] - a[1])
          .slice(0, 5);

        document.getElementById("topFoods").innerHTML = foods.map(food => `
          <tr>
            <td>${food[0]}</td>
            <td>${food[1]} units</td>
          </tr>
        `).join("");
      } catch(error) {
        console.error("Top Foods Error:", error);
      }
    }

        </div>

        <div class="admin-card fade-in stagger-1" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;">
            <i class="fas fa-kitchen-set"></i> Chef Queue
          </h3>
          <div id="chefQueueCard">Loading...</div>
        </div>

        <div class="admin-card fade-in stagger-1" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Recent Orders</h3>
          <table class="admin-table" style="width:100%">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recentOrders">
              ${ordersList.slice(0,5).map(order => `
                <tr>
                  <td>${order.customerName}</td>
                  <td>$${(order.totalAmount || order.total || 0).toFixed(2)}</td>
                  <td>${order.paymentMethod || 'COD'} / ${order.paymentStatus || 'Pending'}</td>
                  <td>${order.status}</td>
                </tr>
              `).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--fg-muted)">No orders yet.</td></tr>`}
            </tbody>
          </table>
        </div>

        <div class="admin-card fade-in stagger-2" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Food Items</h3>
          <div class="admin-split-grid" style="grid-template-columns:1fr 360px;">
            <div>
              ${getFoods().length?`<table class="admin-table"><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${getFoods().map(f=>`<tr><td>${f.name}</td><td>${f.category}</td><td>$${f.price.toFixed(2)}</td><td><span style="background:${f.available !== false ? 'var(--green)' : 'var(--accent)'};color:#fff;padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;">${f.available !== false ? 'In Stock' : 'Unavailable'}</span></td><td><button class="btn btn-outline btn-sm" onclick="editFood('${f.id}')"><i class="fas fa-edit"></i></button> <button class="btn ${f.available !== false ? 'btn-outline' : 'btn-primary'} btn-sm" onclick="toggleFoodAvailability('${f.id}', ${f.available !== false})" title="${f.available !== false ? 'Mark unavailable' : 'Restock'}"><i class="fas ${f.available !== false ? 'fa-ban' : 'fa-rotate'}"></i></button> <button class="btn btn-danger btn-sm" onclick="deleteFood('${f.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table>`:'<p style="color:var(--fg-muted)">No food items yet.</p>'}
            </div>
            <div style="background:var(--bg);padding:16px;border-radius:16px;border:1px solid var(--border);">
              <h4 style="font-size:1rem;font-weight:700;margin-bottom:12px">Add food item</h4>
              <form id="foodForm">
                <div class="form-group"><label>Name</label><input class="form-input" id="foodName" placeholder="Dish name"></div>
                <div class="form-group"><label>Category</label><input class="form-input" id="foodCategory" placeholder="Category"></div>
                <div class="form-group"><label>Price</label><input class="form-input" id="foodPrice" type="number" step="0.01" placeholder="0.00"></div>
                <div class="form-group"><label>Badge</label><input class="form-input" id="newFoodBadge" placeholder="popular / spicy / new (optional)"></div>
                <div class="form-group" style="display:flex;align-items:center;gap:10px;">
                  <input type="checkbox" id="newFoodTrending" style="width:18px;height:18px;">
                  <label for="newFoodTrending" style="margin:0;cursor:pointer;">Show as "Trending Now" on homepage</label>
                </div>
                <div class="form-group">
                  <label>Image</label>
                  <input class="form-input" id="newFoodImg" placeholder="Paste image URL, or upload from your device below">
                  <div style="display:flex;align-items:center;gap:12px;margin-top:10px;">
                    <label for="newFoodImgFile" class="food-upload-btn">
                      <i class="fas fa-camera"></i> Choose Photo
                    </label>
                    <input type="file" id="newFoodImgFile" accept="image/*" style="display:none;">
                    <span id="newFoodImgFileName" style="font-size:0.85rem;color:var(--fg-muted);">No file chosen</span>
                  </div>
                  <div id="newFoodImgPreviewWrap" style="display:none;margin-top:12px;">
                    <img id="newFoodImgPreview" class="food-upload-preview">
                  </div>
                </div>
                <div class="form-group"><label>Description</label><textarea class="form-input" id="foodDescription" placeholder="Short description"></textarea></div>
                <button class="btn btn-primary" type="submit">Add Food</button>
              </form>
            </div>
          </div>
        </div>

        <div class="admin-card fade-in stagger-2" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Coupon Management</h3>
          <div class="admin-split-grid">
            <div>
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>Discount</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="couponTable">
                  <tr><td colspan="4" style="text-align:center;color:var(--fg-muted)">Loading coupons...</td></tr>
                </tbody>
              </table>
            </div>
            <div style="background:var(--bg);padding:16px;border-radius:16px;border:1px solid var(--border);">
              <h4 style="font-size:1rem;font-weight:700;margin-bottom:12px">Add coupon</h4>
              <form id="couponForm" onsubmit="event.preventDefault();addCoupon()">
                <div class="form-group"><label>Code</label><input class="form-input" id="couponCodeInput" placeholder="WELCOME10"></div>
                <div class="form-group"><label>Discount (%)</label><input class="form-input" id="couponDiscountInput" type="number" min="1" max="100" placeholder="10"></div>
                <label style="display:flex;align-items:center;gap:8px;color:var(--fg-muted);font-size:0.9rem;margin-bottom:16px">
                  <input id="couponActiveInput" type="checkbox" checked>
                  Active
                </label>
                <button class="btn btn-primary" type="submit">Add Coupon</button>
              </form>
            </div>
          </div>
        </div>

        <div class="admin-card fade-in stagger-2" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Delivery Boys</h3>
          <div class="admin-split-grid">
            <div>
              <table class="admin-table">
                <thead><tr><th>Name</th><th>Phone</th><th>Vehicle</th><th>Actions</th></tr></thead>
                <tbody id="deliveryBoyTable"></tbody>
              </table>
            </div>
            <div style="background:var(--bg);padding:16px;border-radius:16px;border:1px solid var(--border);">
              <h4 style="font-size:1rem;font-weight:700;margin-bottom:12px">Add delivery boy</h4>
              <form id="newDbForm" onsubmit="event.preventDefault();addDeliveryBoy()">
                <div class="form-group"><label>Name</label><input class="form-input" id="boyName" placeholder="Full name"></div>
                <div class="form-group"><label>Email</label><input class="form-input" id="boyEmail" type="email" placeholder="delivery@flavorvault.com"></div>
                <div class="form-group"><label>Password</label><input class="form-input" id="boyPassword" type="password" placeholder="Password"></div>
                <div class="form-group"><label>Phone</label><input class="form-input" id="boyPhone" placeholder="Phone number"></div>
                <div class="form-group"><label>Vehicle</label><input class="form-input" id="boyVehicle" placeholder="Vehicle details"></div>
                <div class="form-group"><label>UPI ID (for QR payments)</label><input class="form-input" id="boyUpiId" placeholder="e.g. name@okhdfcbank"></div>
                <button class="btn btn-primary" type="submit">Add Delivery Boy</button>
              </form>
            </div>
          </div>
        </div>
        <div class="admin-card fade-in stagger-2" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Orders</h3>
          <div class="filters" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <input type="text" id="searchOrder" placeholder="Search by customer name..." onkeyup="filterOrders()" />
            <select id="statusFilter" onchange="filterOrders()">
              <option value="All">All Status</option>
              <option value="pending">Pending</option>
              <option value="preparing">Preparing</option>
              <option value="out for delivery">Out for Delivery</option>
            </select>
            <button type="button" id="historyBtn" class="btn-orange btn-sm" style="flex:none;display:inline-flex;align-items:center;gap:6px;" onclick="showRecentlyDelivered()"><i class="fas fa-clock-rotate-left"></i> History (Delivered)</button>
          </div>
          <div id="ordersContainer"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;"><span style="color:var(--fg-muted);font-size:0.95rem">Loaded orders from backend.</span><button class="btn btn-outline btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button></div>
        </div>
        <div class="admin-card fade-in stagger-3" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Revenue Overview</h3>
          <canvas id="salesChart" style="max-height: 300px;"></canvas>
        </div>

        <div class="admin-card fade-in stagger-3" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Top Selling Foods</h3>
          <table class="admin-table" style="width:100%">
            <thead>
              <tr>
                <th>Food</th>
                <th>Quantity Sold</th>
              </tr>
            </thead>
            <tbody id="topFoods">
              <tr><td colspan="2" style="text-align:center;color:var(--fg-muted)">Loading foods...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="admin-card fade-in stagger-3" style="margin-top:24px;">
          <h3 style="font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;margin-bottom:16px">Contact</h3>
          <p style="color:var(--fg-muted);margin-bottom:8px">Built-in admin contact for delivery boys and users:</p>
          <p><strong>Email:</strong> ${ADMIN_CONTACT_EMAIL}</p>
        </div>
      `;

      renderCouponTable();

      const newFoodImgInput = document.getElementById("newFoodImg");
      const newFoodImgFile = document.getElementById("newFoodImgFile");
      const newFoodImgPreviewWrap = document.getElementById("newFoodImgPreviewWrap");
      const newFoodImgPreview = document.getElementById("newFoodImgPreview");

      // Auto-save the Add Food form as you type, and restore it on load.
      // This protects against Android killing the tab in the background
      // while the system photo picker is open (common on low-RAM phones),
      // which otherwise reloads the page and wipes anything typed.
      const FOOD_DRAFT_KEY = "fv_addFoodDraft";
      const foodDraftFieldIds = ["foodName", "foodCategory", "foodPrice", "newFoodBadge", "newFoodImg", "foodDescription"];

      function saveFoodDraft() {
        const draft = {};
        foodDraftFieldIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) draft[id] = el.value;
        });
        localStorage.setItem(FOOD_DRAFT_KEY, JSON.stringify(draft));
      }

      function restoreFoodDraft() {
        try {
          const draft = JSON.parse(localStorage.getItem(FOOD_DRAFT_KEY) || "null");
          if (!draft) return;
          foodDraftFieldIds.forEach(id => {
            const el = document.getElementById(id);
            if (el && draft[id]) el.value = draft[id];
          });
          if (draft.newFoodImg) showFoodImgPreview(draft.newFoodImg);
        } catch { /* ignore corrupt draft */ }
      }

      function clearFoodDraft() {
        localStorage.removeItem(FOOD_DRAFT_KEY);
      }

      foodDraftFieldIds.forEach(id => {
        const el = document.getElementById(id);
        if (el && !el.dataset.draftListenerAdded) {
          el.dataset.draftListenerAdded = "true";
          el.addEventListener("input", saveFoodDraft);
        }
      });

      restoreFoodDraft();

      function showFoodImgPreview(url) {
        if (url) {
          newFoodImgPreview.src = url;
          newFoodImgPreviewWrap.style.display = "block";
        } else {
          newFoodImgPreviewWrap.style.display = "none";
        }
      }

      if (newFoodImgInput && !newFoodImgInput.dataset.listenerAdded) {
        newFoodImgInput.dataset.listenerAdded = "true";
        newFoodImgInput.addEventListener("input", () => showFoodImgPreview(newFoodImgInput.value.trim()));
      }

      if (newFoodImgFile && !newFoodImgFile.dataset.listenerAdded) {
        newFoodImgFile.dataset.listenerAdded = "true";
        newFoodImgFile.addEventListener("change", async () => {
          const file = newFoodImgFile.files[0];
          if (!file) return;
          const fileNameLabel = document.getElementById("newFoodImgFileName");
          if (fileNameLabel) fileNameLabel.textContent = file.name;
          try {
            const formData = new FormData();
            formData.append("image", file);
            const response = await fetch(`${window.FLAVORVAULT_API_BASE}/api/foods/upload-image`, {
              method: "POST",
              body: formData
            });
            const data = await response.json();
            if (data.success) {
              const fullUrl = data.url.startsWith("http") ? data.url : `${window.FLAVORVAULT_API_BASE}${data.url}`;
              newFoodImgInput.value = fullUrl;
              showFoodImgPreview(fullUrl);
              saveFoodDraft();
              showToast("Image uploaded", "success");
            } else {
              showToast(data.message || "Upload failed", "error");
            }
          } catch (err) {
            console.error("IMAGE UPLOAD ERROR:", err);
            showToast("Image upload failed", "error");
          }
        });
      }

      const foodForm = document.getElementById("foodForm");
      if (foodForm && !foodForm.dataset.listenerAdded) {
        foodForm.dataset.listenerAdded = "true";
        foodForm.addEventListener("submit", async (e) => {
          e.preventDefault();

          const foodData = {
            name: document.getElementById("foodName").value.trim(),
            category: document.getElementById("foodCategory").value.trim(),
            price: Number(document.getElementById("foodPrice").value),
            description: document.getElementById("foodDescription").value.trim(),
            image: document.getElementById("newFoodImg").value.trim(),
            badge: document.getElementById("newFoodBadge").value.trim(),
            trending: document.getElementById("newFoodTrending").checked
          };

          try {
            const response = await fetch(
              `${window.FLAVORVAULT_API_BASE}/api/foods/add`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(foodData)
              }
            );

            const data = await response.json();

            console.log("STATUS:", response.status);
            console.log("RESPONSE:", data);

            if (!response.ok) {
                showToast(data.message || "Failed to add food", "error");
                return;
            }

            showToast("Food Added Successfully", "success");

            document.getElementById("foodForm").reset();
            const previewWrap = document.getElementById("newFoodImgPreviewWrap");
            if (previewWrap) previewWrap.style.display = "none";
            const fileNameLabel = document.getElementById("newFoodImgFileName");
            if (fileNameLabel) fileNameLabel.textContent = "No file chosen";
            localStorage.removeItem("fv_addFoodDraft");

          } catch (error) {
            console.error(error);
            showToast("Cannot connect to backend", "error");
          }
        });
      }
    }

    function showToast(msg, type='info'){
      // Pop-up notifications disabled per request. Errors/success are still
      // logged to the console for debugging, they just don't show on screen.
      console.log(`[${type}]`, msg);
    }

    // In-page confirmation dialog, replacing native confirm() popups.
    // Usage: if (await showConfirm('Delete this item?')) { ... }
    let _confirmResolve = null;
    function showConfirm(message){
      document.getElementById('confirmModalMessage').textContent = message;
      document.getElementById('confirmModal').style.display = 'flex';
      return new Promise(resolve => { _confirmResolve = resolve; });
    }
    function resolveConfirm(result){
      document.getElementById('confirmModal').style.display = 'none';
      if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
    }

    const socket = io(window.FLAVORVAULT_API_BASE);

    socket.on("new-order", order => {
      showToast(`New Order: ${order.customerName}`, "success");
      loadOrders();
      loadDashboard();
      loadSalesChart();
      loadTopFoods();
    });

    socket.on("delivery-assigned", () => {
      loadOrders();
    });

    window.addEventListener('storage',(event)=>{ if(event.key?.startsWith('fv_')) renderApp(); });
    window.addEventListener('load', async ()=>{ await renderApp(); });

    // Re-fetch fresh data whenever this tab becomes visible/focused again -
    // e.g. after switching to the delivery boy site and coming back, or
    // using the browser Back button. Without this, the admin panel only
    // ever loaded data once on initial page load and could show stale
    // (missing) delivery boys / orders after navigating away and back.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isAdmin()) {
        loadDeliveryBoys();
        loadOrders();
        loadFoods();
        loadCoupons();
      }
    });
    window.addEventListener('pageshow', (event) => {
      if (isAdmin()) {
        loadDeliveryBoys();
        loadOrders();
        loadFoods();
        loadCoupons();
      }
    });
    document.addEventListener('click', (e) => {
      const radio = e.target.closest('input[name="paymentMethod"]');
      if(radio) {
        document.querySelectorAll('label[style*="border:1.5px"]').forEach(l => {
          l.style.borderColor = radio.checked && radio.parentElement === l ? 'var(--accent)' : '#ddd';
          l.style.background = radio.checked && radio.parentElement === l ? 'var(--accent-light)' : 'transparent';
        });
      }
    });

    // ---- Install as an app (PWA) ----
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'inline-flex';
    });
    async function installPwa() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById('installAppBtn').style.display = 'none';
    }
    window.addEventListener('appinstalled', () => {
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'none';
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
