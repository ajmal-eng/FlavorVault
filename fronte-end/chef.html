<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlavorVault Kitchen</title>
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest-chef.json">
  <meta name="theme-color" content="#f97316">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    // Auto-detect the backend the same way the other pages do: assume it's
    // always on port 5000 on whatever host we're viewing this from, since
    // that's correct whether this file is opened directly, via a Live
    // Server extension on another port, or served by the backend itself.
    // Can still be overridden with ?api=http://... for other setups.
    const apiParam = new URLSearchParams(window.location.search).get("api");
    const rawHost = window.location.hostname;
    const host = rawHost || "localhost";
    const protocol = window.location.protocol.startsWith("http") ? window.location.protocol : "http:";
    const defaultApiBase = `${protocol}//${host}:5000`;
    window.FLAVORVAULT_API_BASE = (apiParam || window.__FLAVORVAULT_API_URL__ || defaultApiBase).replace(/\/$/, "");
    const originalFetch = window.fetch.bind(window);
    window.fetch = function(resource, options) {
      const token = localStorage.getItem("chefAuthToken");
      if (token && typeof resource === "string" && resource.startsWith(window.FLAVORVAULT_API_BASE)) {
        options = options || {};
        options.headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
      }
      return originalFetch(resource, options);
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --accent: #e8572a;
      --accent-hover: #d6491f;
      --green: #2d8a4e;
      --amber: #c9832c;
      --bg: #faf7f2;
      --card: #fffdfa;
      --border: #ece4d8;
      --fg: #2b2420;
      --fg-muted: #8a7f72;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(232,87,42,0.06), transparent 45%),
        var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      width: 100%;
      max-width: 480px;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; display: block; }
    header i.fa-kitchen-set { color: var(--accent); font-size: 1.5rem; }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
    }
    .queue-badge {
      background: var(--accent);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 20px;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
    }
    .queue-badge.bump { animation: badgeBump 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes badgeBump {
      0% { transform: scale(1); }
      40% { transform: scale(1.28); background: var(--amber); }
      100% { transform: scale(1); }
    }
    .lock-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lock-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(232,87,42,0.06); }

    /* Ticket stack - the current order card sits on top of two faint offset
       edges, giving a tactile sense of how many tickets are behind it,
       like a real kitchen order rail. */
    .ticket-stack {
      position: relative;
      width: 100%;
      max-width: 480px;
    }
    .ticket-stack::before,
    .ticket-stack::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 92%;
      height: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      transform: translateX(-50%) scale(0.96);
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .ticket-stack::after { bottom: -12px; transform: translateX(-50%) scale(0.92); }
    .ticket-stack.has-queue::before { opacity: 0.7; }
    .ticket-stack.has-more::after { opacity: 0.4; }

    .order-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 34px 36px 30px;
      width: 100%;
      box-shadow: 0 14px 34px rgba(43,36,32,0.08);
      text-align: center;
      animation: ticketIn 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes ticketIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ticket-perf {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
    }
    .ticket-perf span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--border);
    }
    .order-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    .order-time {
      color: var(--fg-muted);
      font-size: 0.88rem;
      margin-bottom: 22px;
    }
    .order-meta {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .meta-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 20px;
      background: rgba(43,36,32,0.05);
      color: var(--fg-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .meta-pill.paid { background: rgba(45,138,78,0.1); color: var(--green); }
    .meta-pill.unpaid { background: rgba(201,131,44,0.12); color: var(--amber); }
    .items-list {
      text-align: left;
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      padding: 18px 0;
      margin-bottom: 26px;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 1.02rem;
    }
    .item-qty {
      background: var(--accent);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      border-radius: 8px;
      padding: 2px 9px;
      margin-right: 10px;
      font-size: 0.85rem;
    }
    .item-price {
      font-family: 'JetBrains Mono', monospace;
      color: var(--fg-muted);
      font-size: 0.9rem;
    }
    .order-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 24px;
      padding: 0 2px;
    }
    .order-total .label { color: var(--fg-muted); font-size: 0.85rem; }
    .order-total .value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.15rem; }
    .prepare-btn {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 19px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(45,138,78,0.22);
    }
    .prepare-btn:hover:not(:disabled) { background: #24703e; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(45,138,78,0.3); }
    .prepare-btn:active:not(:disabled) { transform: translateY(0); }
    .prepare-btn:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; }
    .prepare-btn.success { background: var(--green); }
    .prepare-btn .fa-check-circle { animation: checkPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes checkPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .empty-state {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 64px 36px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      color: var(--fg-muted);
      animation: ticketIn 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    .empty-state i {
      font-size: 2.4rem;
      color: var(--green);
      margin-bottom: 18px;
      display: inline-block;
      animation: breathe 2.6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.75; }
    }
    .empty-state p { font-size: 0.98rem; }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--fg);
      color: #fff;
      padding: 13px 26px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--accent); }
    .login-card {
      animation: ticketIn 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    .login-card input:focus {
      outline: none;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(232,87,42,0.12);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img class="header-logo" src="icons/icon-192x192.png" alt="FlavorVault">
      <h1>Kitchen</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="queue-badge" id="queueBadge">0 waiting</span>
      <button class="lock-btn" id="lockBtn" title="Lock kitchen screen" style="display:none;">
        <i class="fas fa-lock"></i>
      </button>
    </div>
  </header>

  <div id="loginScreen" class="order-card login-card" style="max-width:340px;">
    <h3 style="margin-bottom:16px;">Kitchen Login</h3>
    <input type="password" id="chefPinInput" placeholder="Enter kitchen PIN" inputmode="numeric"
      style="width:100%;padding:14px;border:1px solid var(--border);border-radius:10px;font-size:1.1rem;text-align:center;letter-spacing:4px;margin-bottom:14px;transition:border-color 0.2s, box-shadow 0.2s;">
    <p id="chefLoginError" style="color:var(--accent);font-size:0.85rem;margin-bottom:14px;display:none;"></p>
    <button class="prepare-btn" id="chefLoginBtn"><i class="fas fa-unlock"></i> Unlock</button>
  </div>

  <div class="ticket-stack" id="ticketStack" style="display:none;">
    <div id="content">
      <div class="empty-state">
        <i class="fas fa-circle-notch fa-spin"></i>
        <p>Loading...</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const loginScreen = document.getElementById('loginScreen');
    const ticketStack = document.getElementById('ticketStack');
    const lockBtn = document.getElementById('lockBtn');

    function showApp() {
      loginScreen.style.display = 'none';
      ticketStack.style.display = 'block';
      lockBtn.style.display = 'flex';
    }
    function showLogin() {
      ticketStack.style.display = 'none';
      lockBtn.style.display = 'none';
      loginScreen.style.display = 'block';
      document.getElementById('chefPinInput').value = '';
      document.getElementById('chefPinInput').focus();
    }

    async function chefLogin() {
      const pin = document.getElementById('chefPinInput').value.trim();
      const errEl = document.getElementById('chefLoginError');
      errEl.style.display = 'none';
      if (!pin) { errEl.textContent = 'Enter the kitchen PIN'; errEl.style.display = 'block'; return; }
      try {
        const res = await fetch(`${window.FLAVORVAULT_API_BASE}/api/chef/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        const data = await res.json();
        if (!data.success) {
          errEl.textContent = data.message || 'Incorrect PIN';
          errEl.style.display = 'block';
          return;
        }
        localStorage.setItem('chefAuthToken', data.token);
        showApp();
        loadQueue();
      } catch (err) {
        console.error('CHEF LOGIN ERROR:', err);
        errEl.textContent = 'Cannot connect to backend';
        errEl.style.display = 'block';
      }
    }
    document.getElementById('chefLoginBtn').addEventListener('click', chefLogin);
    document.getElementById('chefPinInput').addEventListener('keydown', e => { if (e.key === 'Enter') chefLogin(); });

    lockBtn.addEventListener('click', () => {
      localStorage.removeItem('chefAuthToken');
      showLogin();
    });

    // If already logged in from earlier, skip straight to the queue.
    if (localStorage.getItem('chefAuthToken')) {
      showApp();
    }

    let currentOrder = null;
    let marking = false;
    let lastQueueLength = null;
    let toastTimer = null;

    function showToast(msg, type = 'default') {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer);
      toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> ${msg}`;
      toast.className = `toast show ${type === 'error' ? 'error' : ''}`;
      toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2800);
    }

    function timeAgo(dateStr) {
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins === 1) return '1 minute ago';
      if (mins < 60) return `${mins} minutes ago`;
      const hrs = Math.floor(mins / 60);
      return `${hrs} hour${hrs > 1 ? 's' : ''} ago`;
    }

    function formatCurrency(n) {
      return `₹${Number(n || 0).toFixed(0)}`;
    }

    function render() {
      const content = document.getElementById('content');

      if (!currentOrder) {
        content.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-circle-check"></i>
            <p>All caught up! No orders waiting to be prepared.</p>
          </div>
        `;
        return;
      }

      const order = currentOrder;
      const itemCount = (order.items || []).reduce((sum, i) => sum + (i.quantity || 0), 0);
      const isPaid = String(order.paymentStatus).toLowerCase() === 'paid';

      content.innerHTML = `
        <div class="order-card">
          <div class="ticket-perf"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <div class="order-number">#${String(order._id).slice(-4).toUpperCase()}</div>
          <div class="order-time">For ${order.customerName || 'Customer'} · Placed ${timeAgo(order.createdAt)}</div>
          <div class="order-meta">
            <span class="meta-pill"><i class="fas fa-layer-group"></i> ${itemCount} item${itemCount !== 1 ? 's' : ''}</span>
            <span class="meta-pill ${isPaid ? 'paid' : 'unpaid'}"><i class="fas ${isPaid ? 'fa-check' : 'fa-clock'}"></i> ${isPaid ? 'Paid' : (order.paymentMethod || 'COD')}</span>
          </div>
          <div class="items-list">
            ${(order.items || []).map(i => `
              <div class="item-row">
                <span><span class="item-qty">${i.quantity}</span>${i.name}</span>
              </div>
            `).join('')}
          </div>
          <div class="order-total">
            <span class="label">Order total</span>
            <span class="value">${formatCurrency(order.totalAmount)}</span>
          </div>
          <button class="prepare-btn" id="prepareBtn" ${marking ? 'disabled' : ''}>
            <i class="fas ${marking ? 'fa-spinner fa-spin' : 'fa-check'}"></i> ${marking ? 'Marking...' : 'Mark as Prepared'}
          </button>
          <button class="prepare-btn" id="printTicketBtn" style="margin-top:10px;background:var(--fg-muted,#555);">
            <i class="fas fa-print"></i> Print Ticket
          </button>
        </div>
      `;

      document.getElementById('prepareBtn').addEventListener('click', markPrepared);
      document.getElementById('printTicketBtn').addEventListener('click', () => printTicket(order._id));
    }

    function printTicket(orderId) {
      window.open(
        `${window.FLAVORVAULT_API_BASE}/api/orders/${orderId}/invoice?print=true`,
        "_blank"
      );
    }

    async function loadQueue() {
      try {
        const res = await fetch(`${window.FLAVORVAULT_API_BASE}/api/orders/chef-queue`);
        const data = await res.json();
        if (data.success) {
          currentOrder = data.order;
          const badge = document.getElementById('queueBadge');
          badge.textContent = `${data.queueLength} waiting`;
          if (lastQueueLength !== null && data.queueLength > lastQueueLength) {
            badge.classList.remove('bump');
            void badge.offsetWidth; // restart animation
            badge.classList.add('bump');
          }
          lastQueueLength = data.queueLength;
          ticketStack.classList.toggle('has-queue', data.queueLength > 1);
          ticketStack.classList.toggle('has-more', data.queueLength > 2);
          render();
        }
      } catch (err) {
        console.error('LOAD QUEUE ERROR:', err);
      }
    }

    async function markPrepared() {
      if (!currentOrder || marking) return;
      marking = true;
      render();
      try {
        const res = await fetch(`${window.FLAVORVAULT_API_BASE}/api/orders/${currentOrder._id}/mark-prepared`, {
          method: 'PUT'
        });
        const data = await res.json();
        if (data.success) {
          showToast('Order marked as prepared');
          marking = false;
          await loadQueue();
        } else {
          showToast(data.message || 'Could not update order', 'error');
          marking = false;
          render();
        }
      } catch (err) {
        console.error('MARK PREPARED ERROR:', err);
        showToast('Cannot connect to backend', 'error');
        marking = false;
        render();
      }
    }

    if (localStorage.getItem('chefAuthToken')) {
      loadQueue();
    }

    const socket = io(window.FLAVORVAULT_API_BASE);
    socket.on('new-order', () => { if (localStorage.getItem('chefAuthToken')) loadQueue(); });
    socket.on('order-prepared', () => { if (localStorage.getItem('chefAuthToken')) loadQueue(); });

    // Fallback polling in case the socket connection drops.
    setInterval(() => { if (localStorage.getItem('chefAuthToken')) loadQueue(); }, 15000);
  </script>
  <script src="pwa-install.js"></script>
</body>
</html>
